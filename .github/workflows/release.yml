name: Publish Releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
      filename: ${{ steps.package.outputs.filename }}
      sha256: ${{ steps.package.outputs.sha256 }}
      changelog: ${{ steps.package.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Tagged Commit On Main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Regression And Release Tests
        run: |
          python tests/test_prototype.py
          python -m unittest discover -s tests -p test_release.py -v
          python tests/test_package.py
      - name: Build Production ZIP
        run: python tools/package.py
      - name: Validate Version And Record Verified Build
        id: package
        run: python tools/prepare_nexus_upload.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: build
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist
      - name: Publish Verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
        run: python tools/publish_github_release.py

  nexus:
    needs: [build, github-release]
    if: vars.NEXUSMODS_ENABLED == 'true' && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: nexus
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: dist
      - name: Validate Nexus Configuration And Exact Release ZIP
        env:
          NEXUS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          NEXUS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
        run: python tools/verify_nexus_upload.py
      - name: Upload New Nexus File Version
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: dist/${{ needs.build.outputs.filename }}
          version: ${{ needs.build.outputs.version }}
          changelog: ${{ needs.build.outputs.changelog }}
          display_name: Faction Intervention ${{ needs.build.outputs.version }}
          description: Faction-rank-based Intervention allowances for OpenMW 0.51.0. See the mod page for compatibility and installation.
          category: main
          archive_existing_version: 'false'
          primary_mod_manager_download: 'false'
          allow_mod_manager_download: 'true'
          show_requirements_pop_up: 'true'
          update_mod_version: 'true'
